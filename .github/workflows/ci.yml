# CI runs everything through `nix develop -c` so the toolchain (bun, zig)
# comes from flake.lock — identical to local dev. This matters for the WASM
# drift check: the committed binary must be byte-identical to what CI's zig
# produces, which a separately-pinned setup-zig action can't guarantee.
# Nix install + devshell eval costs ~30s on ubuntu runners; acceptable.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      - name: Install dependencies
        run: nix develop -c bun install --frozen-lockfile

      - name: Svelte check
        run: nix develop -c bun run check

      - name: Lint
        run: nix develop -c bun run lint

      - name: Test
        run: nix develop -c bun run test

      - name: Zig tests
        run: nix develop -c bun run wasm:test

      - name: WASM binary up to date
        run: |
          nix develop -c bun run wasm:build:release
          git diff --exit-code
