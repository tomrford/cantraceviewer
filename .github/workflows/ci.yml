# CI runs everything through `nix develop -c` so Node, pnpm, Rust, wasm-bindgen, and
# Binaryen come from flake.lock, matching local tool versions.
# Nix install + devshell eval costs ~30s on ubuntu runners; acceptable.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      - name: Install dependencies
        run: nix develop -c pnpm install --frozen-lockfile

      - name: Svelte check
        run: nix develop -c pnpm run check

      - name: Lint
        run: nix develop -c pnpm run lint

      - name: Test
        run: nix develop -c pnpm run test

      - name: Rust WASM checks
        run: nix develop -c pnpm run wasm:check

      - name: Rust WASM tests
        run: nix develop -c pnpm run wasm:test

      - name: Rebuild release WASM
        run: |
          nix develop -c pnpm run wasm:build:release
          test -z "$(git status --porcelain -- packages/core/src/wasm-bindgen)"

      - name: Build canonical package tarball
        run: nix develop -c pnpm run package:pack

      - name: Install browser for package smoke
        run: nix develop -c pnpm exec playwright install --with-deps chromium

      - name: Validate installed package entries and browser
        run: nix develop -c pnpm run package:test:tarball

      - name: Build app against installed package
        run: nix develop -c pnpm run package:test:app

      - name: Validate Electron arrangements
        run: nix develop -c xvfb-run -a pnpm run package:test:electron

      - name: Preserve package tarball and checksum
        uses: actions/upload-artifact@v4
        with:
          name: cantraceviewer-package
          path: artifacts/*.tgz*
          if-no-files-found: error
