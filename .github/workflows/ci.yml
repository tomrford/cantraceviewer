# CI runs everything through `nix develop -c` so Node, pnpm, Rust, wasm-bindgen, and
# Binaryen come from flake.lock, matching local tool versions.
# Nix install + devshell eval costs ~30s on ubuntu runners; acceptable.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      - name: Install dependencies
        run: nix develop -c pnpm install --frozen-lockfile

      - name: Svelte check
        run: nix develop -c pnpm run check

      - name: Lint
        run: nix develop -c pnpm run lint

      - name: Test
        run: nix develop -c pnpm run test

      - name: Rust WASM checks
        run: nix develop -c pnpm run wasm:check

      - name: Rust WASM tests
        run: nix develop -c pnpm run wasm:test
