# CI runs everything through `nix develop -c` so Bun, Rust, wasm-bindgen, and
# Binaryen come from flake.lock, matching local development. This keeps the
# committed WASM and generated bindings reproducible in the drift check.
# Nix install + devshell eval costs ~30s on ubuntu runners; acceptable.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    # The committed WASM is generated on Apple silicon, and Rust's cross-host
    # code generation is not byte-for-byte identical for this target.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      - name: Install dependencies
        run: nix develop -c bun install --frozen-lockfile

      - name: Svelte check
        run: nix develop -c bun run check

      - name: Lint
        run: nix develop -c bun run lint

      - name: Test
        run: nix develop -c bun run test

      - name: Rust WASM checks
        run: nix develop -c bun run wasm:check

      - name: Rust WASM tests
        run: nix develop -c bun run wasm:test

      - name: Generated WASM bindings up to date
        run: |
          nix develop -c bun run wasm:build:release
          git diff --exit-code
