name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Advisories land without code changes. Monday 08:17 UTC.
    - cron: '17 8 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v5.2.6
        with:
          version: 2026.10.17
          install_args: --locked

      - name: Install dependencies
        run: mise exec -- pnpm install --frozen-lockfile

      - name: Validate
        run: mise exec -- pnpm run validate

      - name: Preserve package tarball and checksum
        uses: actions/upload-artifact@v7
        with:
          name: cantraceviewer-package
          path: artifacts/*.tgz*
          if-no-files-found: error

  audit:
    name: Audit dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v5.2.6
        with:
          version: 2026.10.17
          install_args: --locked

      # Call the runner directly: `pnpm run` installs dependencies first, which the audits do not need.
      - name: Audit dependencies
        run: mise exec -- node scripts/audit.mjs
