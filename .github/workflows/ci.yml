# CI runs everything through `nix develop -c` so Bun, Rust, wasm-bindgen, and
# Binaryen come from flake.lock, matching local tool versions. Rust codegen is
# not byte-identical across hosts, so CI drift-checks the generated bindings.
# Nix install + devshell eval costs ~30s on ubuntu runners; acceptable.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      - name: Install dependencies
        run: nix develop -c bun install --frozen-lockfile

      - name: Svelte check
        run: nix develop -c bun run check

      - name: Lint
        run: nix develop -c bun run lint

      - name: Test
        run: nix develop -c bun run test

      - name: Rust WASM checks
        run: nix develop -c bun run wasm:check

      - name: Rust WASM tests
        run: nix develop -c bun run wasm:test

      - name: Release WASM builds and generated bindings up to date
        run: |
          nix develop -c bun run wasm:build:release
          git diff --exit-code -- \
            src/lib/wasm-bindgen/cantraceviewer.js \
            src/lib/wasm-bindgen/cantraceviewer.d.ts \
            src/lib/wasm-bindgen/cantraceviewer_bg.wasm.d.ts
