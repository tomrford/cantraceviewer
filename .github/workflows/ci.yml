name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Advisories land without code changes.
    - cron: '17 8 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v31

      - name: Install dependencies
        run: nix develop -c pnpm install --frozen-lockfile

      - name: Validate
        run: nix develop -c pnpm run validate

      - name: Preserve package tarball and checksum
        uses: actions/upload-artifact@v7
        with:
          name: cantraceviewer-package
          path: artifacts/*.tgz*
          if-no-files-found: error

  audit:
    name: Audit dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v31

      # Call the runner directly: `pnpm run` installs dependencies first, which the audits do not need.
      - name: Audit dependencies
        run: nix develop -c node scripts/audit.mjs
