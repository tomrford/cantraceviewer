[package]
name = "cantraceviewer-wasm"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fdeflate = "=0.3.7"
serde = { version = "=1.0.229", features = ["derive"] }
wasm-bindgen = "=0.2.121"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
panic = "abort"
strip = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
serde-wasm-bindgen = "=0.6.5"
