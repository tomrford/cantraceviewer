[install]
exact = true
linkWorkspacePackages = false
minimumReleaseAge = 259200
minimumReleaseAgeExcludes = ["cantraceviewer"]

[fmt]
useTabs = true
singleQuote = true
trailingComma = "none"
printWidth = 100
sortPackageJson = false
sortImports = true
ignorePatterns = ["bun.lock", "/public/", "/wasm/", "/packages/core/src/wasm-bindgen/"]

[fmt.sortTailwindcss]
stylesheet = "./src/app.css"
