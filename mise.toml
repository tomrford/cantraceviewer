min_version = "2026.10.17"

[tool_config]
locked = true

[tools]
node = "26.13.0"
pnpm = "12.18.0"
rust = { version = "1.99.1", profile = "minimal", components = [
	"rust-src",
	"rustfmt",
	"clippy",
	"rust-analyzer"
], targets = [
	"wasm32-unknown-unknown"
] }
# Must match the wasm-bindgen dependency in wasm/Cargo.toml.
"github:wasm-bindgen/wasm-bindgen" = "0.2.121"
"github:WebAssembly/binaryen" = { version = "133", version_prefix = "version_" }
"github:rustsec/rustsec" = { version = "0.22.2", version_prefix = "cargo-audit/v" }

[settings]
minimum_release_age = "3d"
